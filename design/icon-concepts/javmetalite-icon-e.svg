<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">JavMetaLite icon concept E</title>
  <desc id="description">A muted blue movie folder containing one film card and one metadata card.</desc>

  <!-- Transparent canvas. All colors come directly from the JavMetaLite UI palette. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#111821"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#2A3544" stroke-width="12"/>

  <!-- Back of the folder pocket. -->
  <rect x="150" y="470" width="730" height="380" rx="80" fill="#233650"/>

  <!-- Landscape movie card, tilted left like the selected concept. -->
  <g transform="rotate(-9 468 430)">
    <rect x="208" y="252" width="520" height="356" rx="62" fill="#233650"/>
    <rect x="246" y="316" width="48" height="48" rx="13" fill="#111821"/>
    <rect x="246" y="392" width="48" height="48" rx="13" fill="#111821"/>
    <rect x="246" y="468" width="48" height="48" rx="13" fill="#111821"/>
  </g>

  <!-- Portrait metadata card, tilted right and layered above the movie card. -->
  <g transform="translate(0 20) rotate(6 690 430)">
    <rect x="525" y="190" width="330" height="490" rx="66" fill="#2A61B3"/>
    <path d="M590 570V315H645L690 430L735 315H790V570H740V420L715 492H665L640 420V570Z" fill="#F1F5F9"/>
  </g>

  <!-- Front of the folder, with a shallow card notch. -->
  <path fill="#244B8F" d="M230 560H470Q494 560 510 584L536 622Q548 640 572 640H744Q768 640 780 622L806 584Q822 560 846 560Q880 560 880 594V780Q880 850 810 850H220Q150 850 150 780V630Q150 560 220 560Z"/>
</svg>
