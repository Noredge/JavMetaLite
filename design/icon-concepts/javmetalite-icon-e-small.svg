<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">JavMetaLite icon concept E small-size variant</title>
  <desc id="description">A simplified movie folder and metadata card for 16 and 24 pixel Windows icons.</desc>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="#111821"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#2A3544" stroke-width="10"/>

  <!-- A single quiet movie-card silhouette replaces the tiny film perforations. -->
  <g transform="rotate(-7 468 430)">
    <rect x="208" y="270" width="520" height="338" rx="58" fill="#233650"/>
  </g>

  <!-- Slightly straighter and larger so the M remains legible at 16/24 px. -->
  <g transform="translate(0 20) rotate(4 690 430)">
    <rect x="515" y="184" width="350" height="500" rx="66" fill="#2A61B3"/>
    <path d="M576 578V304H642L690 426L738 304H804V578H747V424L718 505H662L633 424V578Z" fill="#F1F5F9"/>
  </g>

  <path fill="#244B8F" d="M230 560H470Q494 560 510 584L536 622Q548 640 572 640H744Q768 640 780 622L806 584Q822 560 846 560Q880 560 880 594V780Q880 850 810 850H220Q150 850 150 780V630Q150 560 220 560Z"/>
</svg>
