name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows automated gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up the reviewed .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show SDK identity
        shell: pwsh
        run: dotnet --info

      - name: Run automated release gate
        shell: pwsh
        run: .\scripts\Test-Automated.ps1 -Configuration Release

      - name: Build and verify the portable package
        shell: pwsh
        run: |
          .\scripts\New-ReleasePackage.ps1
          .\scripts\Test-PortablePackage.ps1

      - name: Upload the verified portable package
        uses: actions/upload-artifact@v7
        with:
          name: portable-package
          path: |
            release/*portable.zip
            release/*portable.zip.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
