name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, mac]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  windows:
    name: Windows build, tests and package
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up the reviewed .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show SDK identity
        shell: pwsh
        run: dotnet --info

      - name: Run automated release gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results/windows | Out-Null
          Start-Transcript -Path artifacts/test-results/windows/automated-gate.log
          try {
            .\scripts\Test-Automated.ps1 -Configuration Release
          } finally {
            Stop-Transcript
          }

      - name: Build and verify the portable package
        shell: pwsh
        run: |
          .\scripts\New-ReleasePackage.ps1
          .\scripts\Test-PortablePackage.ps1

      - name: Upload the verified portable package
        uses: actions/upload-artifact@v7
        with:
          name: portable-package
          path: |
            release/*portable.zip
            release/*portable.zip.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Windows gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-automated-gate-evidence
          path: artifacts/test-results/windows/
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Windows automated gate
    needs: [scope, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require documentation or complete Windows validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['SCOPE_RESULT'] != 'success':
              raise SystemExit('Scope/documentation gate failed')
          if os.environ['FULL'] not in ('true', 'false'):
              raise SystemExit('No valid scope result')
          if os.environ['FULL'] == 'true' and os.environ['WINDOWS_RESULT'] != 'success':
              raise SystemExit('Windows gate did not pass')
          print('PASS: documentation only' if os.environ['FULL'] == 'false' else 'PASS: full Windows gate')
          PY
