name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths: &windows_paths
      - 'windows/**'
      - 'shared/**'
      - '!**/*.md'
      - 'scripts/*.ps1'
      - 'packaging/**'
      - 'global.json'
      - 'NuGet.Config'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, mac]
    paths: *windows_paths
  workflow_dispatch:
    inputs:
      package:
        description: Build and verify the portable ZIP
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: ./scripts/Test-Automated.ps1 -Configuration Release
      - name: Build and verify the portable package
        if: github.ref_type == 'tag' || inputs.package
        run: |
          ./scripts/New-ReleasePackage.ps1
          ./scripts/Test-PortablePackage.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref_type == 'tag' || inputs.package
        with:
          name: portable-package
          path: |
            release/*portable.zip
            release/*portable.zip.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
