name: macOS CI

on:
  push:
    branches: [main]
    tags: ['macos-v*']
    paths: &mac_paths
      - 'macos/**'
      - 'shared/**'
      - 'fixtures/macos/**'
      - 'contracts/worker-v1/**'
      - 'scripts/macos/**'
      - '!**/*.md'
      - 'windows/JavMetaLite.RegressionTests/GatedDownloadHandler.cs'
      - 'scripts/ci/test_ci_tools.py'
      - 'global.json'
      - 'NuGet.Config'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/macos/PACKAGE.md'
      - 'docs/macos/THIRD_PARTY_NOTICES.md'
      - 'docs/macos/licenses/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches: [main]
    paths: *mac_paths
  workflow_dispatch:
    inputs:
      validation:
        description: Daily tests or a signed and tested release candidate
        type: choice
        options: [core, full]
        default: core

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.validation || github.event_name }}
  cancel-in-progress: true

jobs:
  macos:
    name: Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TEST_PROFILE: ${{ (github.ref_type == 'tag' || inputs.validation == 'full') && 'full' || 'core' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Run Mac tests
        run: |
          test "$(uname -m)" = arm64
          ./scripts/macos/test.sh --profile "$TEST_PROFILE" --arch arm64 --configuration Release
      - name: Package and test the extracted app
        if: env.TEST_PROFILE == 'full'
        run: ./scripts/macos/package.sh --arch arm64 --configuration Release --sign-mode adhoc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: env.TEST_PROFILE == 'full'
        with:
          name: macos-arm64-candidate
          path: |
            artifacts/macos/*adhoc.zip
            artifacts/macos/*adhoc.zip.sha256
            artifacts/macos/*adhoc.zip.manifest.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: macos-test-logs
          path: artifacts/test-results/
          retention-days: 7
